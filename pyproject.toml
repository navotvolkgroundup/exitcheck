[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exitcheck"
version = "0.1.0"
description = "Find out whether anything on your network is relaying traffic for strangers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["security", "proxyware", "residential-proxy", "smart-tv", "dns", "lan"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
# No dependencies, deliberately. You are pointing this at your own network;
# it should not drag in a supply chain to do it.
dependencies = []

[project.urls]
Homepage = "https://github.com/navotvolkgroundup/exitcheck"
Issues = "https://github.com/navotvolkgroundup/exitcheck/issues"

[project.scripts]
exitcheck = "exitcheck:main"

[tool.setuptools]
py-modules = ["exitcheck"]
